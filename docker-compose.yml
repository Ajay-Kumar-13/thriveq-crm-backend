services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports: ["5432:5432"]        # published so your IDE-run app can reach it
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build: ./auth-service
    environment:
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_PRIVATE_KEY_PATH: /certs/jwt-private-pkcs8.pem
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:MaxMetaspaceSize=128m"
    volumes:
      - ./certs/jwt-private-pkcs8.pem:/certs/jwt-private-pkcs8.pem:ro     # ONLY this service
    depends_on:
      postgres: { condition: service_healthy }

  
  external-authorization:
    build: ./external-authorization
    environment:
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_PUBLIC_KEY_PATH: /certs/jwt-public.pem
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:MaxMetaspaceSize=128m"
    volumes:
      - ./certs/jwt-public.pem:/certs/jwt-public.pem:ro
    depends_on:
      postgres:     { condition: service_healthy }
      auth-service: { condition: service_started }            # Flyway runs there

  leads-api:
    build: ./leads-api
    environment:
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:MaxMetaspaceSize=128m"
    depends_on:
      postgres:     { condition: service_healthy }
      auth-service: { condition: service_started }


  envoy:
    image: envoyproxy/envoy:v1.39-latest
    ports: 
      - "8080:8080"
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./certs/jwks.json:/etc/envoy/jwks.json:ro
    depends_on: [external-authorization, leads-api, auth-service]
volumes:
  pgdata:


#  command  containers  volume(data)
#  docker compose stop stopped kept
#  docker compose down deleted kept
#  docker compose down -v deleted deleted
#  docker compose start started kept
#  For connecting to database locally: docker compose exec postgres psql -U crm -d crm