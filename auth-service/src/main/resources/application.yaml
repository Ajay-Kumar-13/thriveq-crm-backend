spring:
  application:
    name: auth-service
  server:
    port: 9100
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:5432/crm
    username: ${DB_USER:crm}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/crm
    user: ${DB_USER:crm}
    password: ${DB_PASSWORD}
    locations: classpath:db/migration
    schemas: auth,crm

jwt:
  private-key-path: ${JWT_PRIVATE_KEY_PATH:/home/ajay-kumar/Desktop/CRM/crm/certs/jwt-private-pkcs8.pem}
  kid: crm-k1
  issuer: crm-auth
  audience: crm-api
  ttl-seconds: 900          # 15 minutes — see below

logging:
  level:
    com.thriveq.crm.auth.auth_service: INFO