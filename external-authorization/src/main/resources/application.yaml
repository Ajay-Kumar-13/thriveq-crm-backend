server:
  port: 9000

spring:
  application:
    name: external-authortization
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:5432/crm
    username: ${DB_USER:crm}
    # .env is a Docker Compose file. Compose automatically reads it and injects those vars into containers it starts — that's how Postgres got its password.
    # But when you run ./gradlew bootRun in a terminal, that's not Compose — it's a plain process on your host, and nothing teaches your shell to read .env. Gradle/Java don't know .env exists; only Compose does.
    #So there are two worlds:
    #Container (Postgres) → Compose reads .env → gets DB_PASSWORD automatically.
    #Your terminal (bootRun) → no Compose → must export DB_PASSWORD yourself.
    password: ${DB_PASSWORD}
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10,expireAfterWrite=30s

jwt:
  public-key-path: ${JWT_PRIVATE_KEY_PATH:/home/ajay-kumar/Desktop/CRM/crm/certs/jwt-public.pem}
  issuer: crm-auth
  audience: crm-api

policy:
  path: classpath:rbac-policy.yml