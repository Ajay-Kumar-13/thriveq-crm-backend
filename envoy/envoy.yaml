admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

static_resources:
  listeners:
  - name: ingress
    address:
      socket_address: { address: 0.0.0.0, port_value: 8080 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          use_remote_address: true
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                text_format_source:
                  inline_string: "[%START_TIME%] \"%REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%\" %RESPONSE_CODE% flags=%RESPONSE_FLAGS% %DURATION%ms rid=%REQ(X-REQUEST-ID)%\n"
          http_filters:
          # ═══ FILTER 1 — the sanitizer. MUST be first. ═══
          - name: envoy.filters.http.lua
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
              default_source_code:
                inline_string: |
                  function envoy_on_request(handle)
                    handle:headers():remove("x-user-id")
                    handle:headers():remove("x-user-roles")
                  end
          # ═══ FILTER 2 — rate limit (off by default, on per-route) ═══
          - name: envoy.filters.http.local_ratelimit
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
              stat_prefix: http_local_rate_limiter
          # ═══ FILTER 3 — verify the signature ═══
          - name: envoy.filters.http.jwt_authn
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
              providers:
                crm_auth:
                  issuer: crm-auth
                  audiences: [crm-api]
                  forward: true                # ← keep Authorization for the PDP
                  local_jwks:
                    filename: /etc/envoy/jwks.json
              rules:
              - match: { prefix: "/auth/" }    # no 'requires' ⇒ no token needed
              - match: { prefix: "/health" }
              - match: { prefix: "/" }
                requires: { provider_name: crm_auth }
          # ═══ FILTER 4 — ask the PDP ═══ 
          - name: envoy.filters.http.ext_authz
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
              transport_api_version: V3
              failure_mode_allow: false        # FAIL CLOSED
              status_on_error:
                code: ServiceUnavailable
              http_service:
                server_uri:
                  uri: http://authz-service:9000
                  cluster: authz_service
                  timeout: 0.5s
                path_prefix: "/authz"
                authorization_request:
                  allowed_headers:
                    patterns:
                      - exact: authorization
                      - exact: x-request-id
                authorization_response:
                  allowed_upstream_headers:
                    patterns:
                      - exact: x-user-id
                      - exact: x-user-roles
          # ═══ FILTER 5 — terminal. Always last. ═══
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

          route_config:
            name: local_route
            virtual_hosts:
            - name: crm
              domains: ["*"]
              routes:
              # ── login: no token required, rate limited ──
              - match: { prefix: "/auth/" }
                route:
                  cluster: auth_cluster
                  timeout: 10s
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true
                  envoy.filters.http.local_ratelimit:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                    stat_prefix: login_rl
                    token_bucket:
                      max_tokens: 5
                      tokens_per_fill: 5
                      fill_interval: 60s
                    filter_enabled:
                      default_value: { numerator: 100, denominator: HUNDRED }
                    filter_enforced:
                      default_value: { numerator: 100, denominator: HUNDRED }
                    descriptors:                       # ← per-IP bucket
                    - entries:
                      - key: remote_address
                      token_bucket:
                        max_tokens: 5
                        tokens_per_fill: 5
                        fill_interval: 60s
                  rate_limits:
                  - actions:
                    - remote_address: {}

              # ── everything else ──
              - match: { prefix: "/" }
                route: { cluster: app_cluster, timeout: 15s }
              
  clusters:
  - name: app_cluster
    type: STRICT_DNS
    connect_timeout: 0.25s
    load_assignment:
      cluster_name: app_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address: { socket_address: { address: leads-api, port_value: 8081 } }

  - name: auth_cluster
    type: STRICT_DNS
    connect_timeout: 0.25s
    load_assignment:
      cluster_name: auth_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address: { socket_address: { address: auth-service, port_value: 9100 } }

  - name: authz_cluster
    type: STRICT_DNS
    connect_timeout: 0.25s
    load_assignment:
      cluster_name: authz_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address: { socket_address: { address: external-authorization, port_value: 9000 } }